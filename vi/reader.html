<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đọc tài liệu — Chế tạo máy / Machine Building</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .reader-bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e7ecf0}
  .reader-bar .wrap.bar{align-items:center;min-height:60px}
  .reader-title{font-size:15px;font-weight:600;color:#22323d;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;padding:0 14px}
  .reader-frame{width:100%;height:calc(100vh - 61px);border:0;display:block;background:#f4f7f9}
  .reader-err{padding:40px;text-align:center;color:#5a6b75;font-family:'Inter',sans-serif}
  .reader-err code{font-family:var(--mono);background:#f4f7f9;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<header class="topbar reader-bar">
  <div class="wrap bar">
    <a class="brand" href="../index.html" aria-label="Chế tạo máy">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="16" cy="16" r="6.5"/><circle cx="16" cy="16" r="2.2" fill="currentColor" stroke="none"/>
            <path d="M16 4.5v3M16 24.5v3M4.5 16h3M24.5 16h3M7.6 7.6l2.1 2.1M22.3 22.3l2.1 2.1M24.4 7.6l-2.1 2.1M9.7 22.3l-2.1 2.1"/>
          </g>
        </svg>
      </span>
      <span class="brand-txt"><strong>Chế tạo máy</strong><em>Machine Building</em></span>
    </a>
    <h1 class="reader-title" id="rtitle">Đọc tài liệu</h1>
    <div class="bar-right">
      <a class="btn btn-s" id="rdownload" href="#" target="_blank" rel="noopener" style="margin-left:8px">Tải về</a>
      <a class="btn btn-p" href="../books/" style="margin-left:8px">← Thư viện</a>
    </div>
  </div>
</header>

<iframe class="reader-frame" id="rframe" title="Trình đọc PDF" loading="lazy"></iframe>

<div class="reader-err" id="rerr" style="display:none">
  <p>Tài liệu này không hiển thị được bên trong trang.</p>
  <p>Dùng <a id="rerrlink" href="#">liên kết tải về / mở</a> thay thế.</p>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var file = q.get('file');
  var title = q.get('title');
  var frame = document.getElementById('rframe');
  var dl = document.getElementById('rdownload');
  var err = document.getElementById('rerr');
  var errlink = document.getElementById('rerrlink');
  if (title) { document.getElementById('rtitle').textContent = title; document.title = 'Đọc tài liệu — ' + title; }
  if (!file) {
    document.getElementById('rtitle').textContent = 'Chưa có tài liệu';
    frame.style.display = 'none'; err.style.display = 'block';
    return;
  }
  var url = file;
  if (url.indexOf('://') === -1 && url.charAt(0) === '/') {
    url = location.origin + url;
  }
  frame.src = url;
  dl.href = url;
  errlink.href = url;
  frame.addEventListener('load', function(){
    try {
      var ct = (frame.contentDocument && frame.contentDocument.contentType) || '';
      if (ct && ct.indexOf('pdf') === -1 && ct.indexOf('html') !== -1) { err.style.display = 'block'; }
    } catch(e){ /* cross-origin frame: ignore */ }
  });
  frame.addEventListener('error', function(){ err.style.display = 'block'; });
})();
</script>
</body>
</html>
